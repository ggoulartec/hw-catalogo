<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#1a2b56"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="50%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffc837"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255, 122, 0, 0.4)" stroke-width="6"/>

  <!-- Chamas de fundo / Brilho -->
  <path d="M150,380 C110,340 100,260 160,200 C170,240 210,250 200,170 C240,210 270,160 280,110 C320,170 390,200 360,310 C340,380 260,420 180,410 C160,405 140,395 150,380 Z" fill="url(#flame)" opacity="0.85" filter="url(#glow)"/>

  <!-- Silhueta Estilizada de Carro Esportivo -->
  <g transform="translate(64, 180) scale(0.75)" filter="url(#glow)">
    <!-- Corpo do Carro -->
    <path d="M40,200 L110,130 Q170,80 280,75 L380,105 Q440,115 480,165 L490,200 Q490,225 460,230 L400,230 C395,200 365,175 330,175 C295,175 265,200 260,230 L170,230 C165,200 135,175 100,175 C65,175 35,200 30,230 L10,230 Q0,215 40,200 Z" fill="#ffffff"/>
    
    <!-- Vidros e Teto -->
    <path d="M135,130 L260,95 L350,115 L320,145 L160,145 Z" fill="#040816" opacity="0.9"/>
    
    <!-- Rodas -->
    <!-- Roda Traseira -->
    <circle cx="100" cy="225" r="45" fill="#111" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="100" cy="225" r="20" fill="url(#gold)"/>
    
    <!-- Roda Dianteira -->
    <circle cx="330" cy="225" r="45" fill="#111" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="330" cy="225" r="20" fill="url(#gold)"/>
  </g>

  <!-- Texto HW Stylized -->
  <text x="256" y="440" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="52" font-weight="900" font-style="italic" fill="url(#gold)" text-anchor="middle" letter-spacing="4">HOT WHEELS</text>
  <text x="256" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#c8d4ff" text-anchor="middle" letter-spacing="6">CATÁLOGO</text>
</svg>
